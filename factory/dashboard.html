<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Software Factory</title>
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --ink: #1d1d1f; --muted: #6e6e73; --line: #e3e3e0;
    --pass: #1f8a4c; --pass-bg: #e3f4ea; --changes: #b4541a; --changes-bg: #fbeadf;
    --pending: #8a8a8f; --pending-bg: #efefed; --human: #c62a3a; --human-bg: #fdecee;
    --accent: #3b5bdb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141416; --panel: #1e1e21; --ink: #ececef; --muted: #9a9aa2; --line: #2e2e33;
      --pass: #5fd08f; --pass-bg: #1d3327; --changes: #f0a06a; --changes-bg: #3a2619;
      --pending: #8a8a92; --pending-bg: #29292d; --human: #ff7a87; --human-bg: #3d1d22;
      --accent: #8ea6ff;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; align-items: baseline; gap: 12px; padding: 20px 24px 8px; }
  h1 { font-size: 18px; margin: 0; font-weight: 600; }
  #status { color: var(--muted); font-size: 12px; }
  .human { margin: 8px 24px 0; padding: 12px; border-radius: 10px; background: var(--human-bg);
           border: 1px solid var(--human); }
  .human h2 { color: var(--human); }
  .human:empty { display: none; }
  .board { display: grid; grid-template-columns: repeat(5, minmax(200px, 1fr)); gap: 12px;
           padding: 16px 24px 24px; overflow-x: auto; }
  .col { min-width: 200px; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
       margin: 0 0 8px; font-weight: 600; display: flex; justify-content: space-between; }
  h2 .agent { text-transform: none; letter-spacing: 0; font-weight: 400; }
  .lane { display: flex; flex-direction: column; gap: 8px; min-height: 60px; padding: 6px;
          border-radius: 10px; border: 1px dashed var(--line); }
  .human .lane { flex-direction: row; flex-wrap: wrap; border: none; padding: 0; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px;
          cursor: pointer; transition: border-color .15s; min-width: 200px; }
  .card:hover { border-color: var(--accent); }
  .card .id { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); }
  .card .title { margin: 2px 0 6px; font-weight: 500; }
  .card .meta { font-size: 11px; color: var(--muted); margin-top: 6px; }
  .round { display: flex; align-items: center; gap: 4px; margin-top: 4px; }
  .round .n { font-size: 10px; color: var(--muted); width: 18px; }
  .chip { font-size: 10px; padding: 1px 6px; border-radius: 999px; background: var(--pending-bg);
          color: var(--pending); }
  .chip.PASS { background: var(--pass-bg); color: var(--pass); }
  .chip.CHANGES { background: var(--changes-bg); color: var(--changes); }
  .badge { font-size: 10px; font-weight: 600; padding: 1px 6px; border-radius: 4px; }
  .badge.APPROVE { background: var(--pass-bg); color: var(--pass); }
  .badge.ESCALATE { background: var(--human-bg); color: var(--human); }
  .empty { color: var(--muted); font-size: 12px; padding: 6px; }
  #drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(640px, 100%); background: var(--panel);
            border-left: 1px solid var(--line); transform: translateX(100%); transition: transform .2s;
            display: flex; flex-direction: column; visibility: hidden; }
  #drawer.open { transform: none; visibility: visible; box-shadow: -8px 0 24px rgba(0,0,0,.08); }
  a { color: var(--accent); }
  #drawer .top { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px;
                 border-bottom: 1px solid var(--line); }
  #drawer button { background: none; border: none; color: var(--muted); font-size: 20px; cursor: pointer; }
  #tabs { display: flex; flex-wrap: wrap; gap: 4px; padding: 10px 18px; border-bottom: 1px solid var(--line); }
  #tabs a { font: 11px ui-monospace, Menlo, monospace; padding: 3px 8px; border-radius: 6px;
            color: var(--muted); cursor: pointer; text-decoration: none; }
  #tabs a.on { background: var(--pending-bg); color: var(--ink); }
  #doc { padding: 4px 18px 24px; overflow-y: auto; }
  #doc pre { background: var(--bg); padding: 10px; border-radius: 6px; overflow-x: auto; font-size: 12px; }
  #doc code { font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
  #doc h1, #doc h2, #doc h3 { text-transform: none; letter-spacing: 0; color: var(--ink); font-size: 15px; margin: 16px 0 6px; }
  #doc .verdict { font-weight: 600; }
  @media (max-width: 700px) {
    header, .board { padding-left: 16px; padding-right: 16px; }
    .human { margin: 8px 16px 0; }
    .board { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<header><h1>Software Factory</h1><span id="status">loading…</span></header>
<section class="human" id="human"></section>
<main class="board" id="board"></main>
<aside id="drawer">
  <div class="top"><strong id="dtitle"></strong><button onclick="closeDrawer()" aria-label="Close">×</button></div>
  <nav id="tabs"></nav>
  <article id="doc"></article>
</aside>
<script>
// Stages in loop order; "needs-human" is drawn as its own band above the board.
const STAGES = [
  ["spec", "Spec", "spec-writer"], ["build", "Build", "builder"], ["review", "Review", "4 reviewers"],
  ["approve", "Approve", "approver"], ["merged", "Merged", "main"],
];
const REVIEWERS = ["security", "ux", "ui", "code"];
const DEMO = new URLSearchParams(location.search).has("demo");
let board = { jobs: [] }, openJob = null;

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function chips(reviews, n) {
  return `<div class="round"><span class="n">R${n}</span>` +
    REVIEWERS.map(r => { const v = (reviews || {})[r] || "pending";
      return `<span class="chip ${esc(v)}" title="${r}: ${esc(v)}">${r}</span>`; }).join("") + "</div>";
}

function card(job) {
  const rounds = (job.history || []).map((r, i) => chips(r, i + 1));
  if (job.stage === "review") rounds.push(chips(job.reviews, job.round));
  const badge = job.decision ? ` <span class="badge ${esc(job.decision)}">${esc(job.decision)}</span>` : "";
  return `<div class="card" onclick="openDrawer('${esc(job.id)}')">
    <div class="id">${esc(job.id)}${badge}</div>
    <div class="title">${esc(job.title || job.id)}</div>
    ${rounds.join("")}
    <div class="meta">${esc(job.branch || "")}</div></div>`;
}

function render() {
  const jobs = board.jobs || [];
  document.getElementById("board").innerHTML = STAGES.map(([key, label, agent]) => {
    const here = jobs.filter(j => j.stage === key);
    return `<div class="col"><h2>${label}<span class="agent">${agent}</span></h2><div class="lane">
      ${here.map(card).join("") || '<div class="empty">—</div>'}</div></div>`;
  }).join("");
  const human = jobs.filter(j => j.stage === "needs-human");
  document.getElementById("human").innerHTML = human.length
    ? `<h2>Needs human <span class="agent">/factory approve &lt;job-id&gt; · /factory rework &lt;job-id&gt; &lt;note&gt;</span></h2>
       <div class="lane">${human.map(card).join("")}</div>` : "";
  if (!jobs.length) document.getElementById("board").insertAdjacentHTML("beforeend",
    '<div class="empty" style="grid-column:1/-1">No jobs yet. Run <code>/factory next</code> in Claude Code, or open <a href="?demo">the demo</a>.</div>');
}

async function poll() {
  try {
    if (DEMO) board = DEMO_BOARD;
    else board = await (await fetch("board.json", { cache: "no-store" })).json();
    document.getElementById("status").textContent =
      (DEMO ? "demo data · " : "") + "updated " + new Date().toLocaleTimeString();
    render();
    if (openJob) refreshTabs();
  } catch (e) {
    document.getElementById("status").textContent = "can't read board.json — serve this folder with python3 -m http.server";
  }
}

// Every file a job can have, derived from the folder layout in SKILL.md.
function jobFiles(job) {
  const files = ["spec.md", "build.md", "rework.md"];
  const rounds = Math.max(job.round || 0, (job.history || []).length);
  for (let n = 1; n <= rounds; n++) REVIEWERS.forEach(r => files.push(`round-${n}/review-${r}.md`));
  files.push("decision.md");
  return files;
}

async function load(job, file) {
  if (DEMO) return (DEMO_FILES[job.id] || {})[file] ?? null;
  const res = await fetch(`jobs/${job.id}/${file}`, { cache: "no-store" });
  return res.ok ? res.text() : null;
}

let current = null, available = [];
async function refreshTabs() {
  const job = (board.jobs || []).find(j => j.id === openJob);
  if (!job) return;
  const found = [];
  for (const f of jobFiles(job)) { const t = await load(job, f); if (t !== null) found.push([f, t]); }
  available = found;
  if (!current || !found.some(([f]) => f === current)) current = found.length ? found[0][0] : null;
  document.getElementById("tabs").innerHTML = found.map(([f]) =>
    `<a class="${f === current ? "on" : ""}" onclick="show('${f}')">${f}</a>`).join("") ||
    '<span class="empty">No files yet.</span>';
  const doc = found.find(([f]) => f === current), html = doc ? markdown(doc[1]) : "";
  const el = document.getElementById("doc");
  if (el.dataset.src !== html) { el.innerHTML = html; el.dataset.src = html; }  // keep scroll while polling
}

function show(f) { current = f; refreshTabs(); }
function openDrawer(id) {
  openJob = id; current = null;
  document.getElementById("dtitle").textContent = id;
  document.getElementById("drawer").classList.add("open");
  refreshTabs();
}
function closeDrawer() { openJob = null; document.getElementById("drawer").classList.remove("open"); }
document.addEventListener("keydown", e => { if (e.key === "Escape") closeDrawer(); });

// Just enough Markdown for specs and reviews: headings, lists, code, bold, inline code.
function markdown(src) {
  const inline = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  const out = []; let list = false, code = null;
  for (const line of src.split("\n")) {
    if (line.startsWith("```")) {
      if (code === null) code = []; else { out.push(`<pre><code>${esc(code.join("\n"))}</code></pre>`); code = null; }
      continue;
    }
    if (code !== null) { code.push(line); continue; }
    const li = line.match(/^\s*[-*]\s+(.*)/);
    if (!li && list) { out.push("</ul>"); list = false; }
    const h = line.match(/^(#{1,3})\s+(.*)/);
    if (h) out.push(`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`);
    else if (li) { if (!list) { out.push("<ul>"); list = true; } out.push(`<li>${inline(li[1])}</li>`); }
    else if (/^(VERDICT:|APPROVE|ESCALATE)/.test(line)) out.push(`<p class="verdict">${inline(line)}</p>`);
    else if (line.trim()) out.push(`<p>${inline(line)}</p>`);
  }
  if (list) out.push("</ul>");
  if (code !== null) out.push(`<pre><code>${esc(code.join("\n"))}</code></pre>`);
  return out.join("");
}

// Sample data for ?demo, so the board can be seen before the first job runs.
const DEMO_BOARD = { jobs: [
  { id: "001-about-command", title: "Add an /about command", branch: "factory/001-about-command",
    stage: "merged", round: 1, decision: "APPROVE", reviews: { security: "PASS", ux: "PASS", ui: "PASS", code: "PASS" },
    history: [{ security: "PASS", ux: "PASS", ui: "PASS", code: "PASS" }] },
  { id: "002-feedback-rate-limit", title: "Rate-limit /feedback", branch: "factory/002-feedback-rate-limit",
    stage: "review", round: 2, reviews: { security: "PASS", ux: "PASS", ui: "pending", code: "pending" },
    history: [{ security: "CHANGES", ux: "PASS", ui: "PASS", code: "CHANGES" }] },
  { id: "003-reminder-timezones", title: "Show reminder times in the user's timezone", branch: "factory/003-reminder-timezones",
    stage: "needs-human", round: 3, decision: "ESCALATE", reviews: { security: "PASS", ux: "CHANGES", ui: "PASS", code: "PASS" },
    history: [{ security: "PASS", ux: "CHANGES", ui: "PASS", code: "PASS" }, { security: "PASS", ux: "CHANGES", ui: "PASS", code: "PASS" },
              { security: "PASS", ux: "CHANGES", ui: "PASS", code: "PASS" }] },
  { id: "004-help-grouping", title: "Group /help by topic", branch: "factory/004-help-grouping", stage: "build", round: 0 },
  { id: "005-meal-history", title: "Remember the last 3 /meal picks", branch: "factory/005-meal-history", stage: "spec", round: 0 },
] };
const DEMO_FILES = {
  "002-feedback-rate-limit": {
    "spec.md": "# 002-feedback-rate-limit: Rate-limit /feedback\n## Acceptance criteria\n- [ ] AC1 a 6th submission within an hour gets a friendly refusal\n- [ ] AC2 the limit resets after an hour",
    "build.md": "# Build — round 2\n## Test run\n`48 passed, 3 skipped`\n## Review responses\n- security: count is now per user id, not per chat",
    "round-1/review-security.md": "VERDICT: CHANGES\n- `bot.py:402` limit is keyed by chat id; a user can bypass it from a group.",
    "round-1/review-code.md": "VERDICT: CHANGES\n- `tests/test_feedback_form.py` has no test for the reset (AC2).",
    "round-1/review-ux.md": "VERDICT: PASS", "round-1/review-ui.md": "VERDICT: PASS",
    "round-2/review-security.md": "VERDICT: PASS", "round-2/review-ux.md": "VERDICT: PASS",
  },
  "003-reminder-timezones": { "decision.md": "ESCALATE\nThe ux reviewer still asks for a timezone prompt after 2 reworks; a person should pick the wording." },
};

poll();
setInterval(poll, 2000);
</script>
</body>
</html>
