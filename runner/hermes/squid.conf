# Egress proxy for the Hermes sandbox network (design H5 of add-hermes-agent-backend).
# The sandbox network is --internal; this proxy is its only way out, and only to PyPI.
http_port 3128

acl pypi dstdomain pypi.org files.pythonhosted.org
acl SSL_ports port 443
acl CONNECT method CONNECT

http_access deny CONNECT !SSL_ports
http_access allow CONNECT pypi
http_access allow pypi
http_access deny all

cache deny all
access_log stdio:/dev/stdout
